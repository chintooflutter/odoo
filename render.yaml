services:
  - type: web
    name: odoo
    env: docker
    repo: https://github.com/YOUR_USERNAME/YOUR_REPO_NAME
    branch: 18.0  # or your active Odoo branch
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    envVars:
      - key: DB_HOST
        fromService:
          type: pserv
          name: odoo-db
          property: HOSTNAME
      - key: DB_PORT
        value: 5432
      - key: DB_USER
        value: odoo
      - key: DB_PASSWORD
        fromDatabase:
          name: odoo-db
          property: password
      - key: DB_NAME
        fromDatabase:
          name: odoo-db
          property: database

databases:
  - name: odoo-db
    databaseName: odoo
    user: odoo
